<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Sieve</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/logo.png" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-topbar">
      <a href="/index.html" class="brand"><img src="/logo.png" class="brand-mark" alt="Sieve logo" />Sieve</a>
      <div class="actions">
        <span style="font-size:13.5px;color:var(--ink-soft);" data-user-business>…</span>
        <a href="/team.html" class="btn btn-ghost btn-sm">Team</a>
        <a href="/templates.html" class="btn btn-ghost btn-sm">Templates</a>
        <a href="/billing.html" class="btn btn-ghost btn-sm">Billing</a>
        <button class="btn btn-ghost btn-sm" data-logout>Log out</button>
      </div>
    </div>
    <main class="app-main">
      <div class="page-head">
        <h1>Your scorecards</h1>
        <button class="btn btn-accent" id="new-btn">+ New scorecard</button>
      </div>
      <div id="stats"></div>
      <div id="content"><p style="color:var(--ink-faint);">Loading…</p></div>
    </main>
  </div>
  <script src="/app.js"></script>
  <script>
    (async () => {
      const user = await requireUser();
      if (!user) return;

      const content = document.getElementById('content');
      const statsEl = document.getElementById('stats');

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      function renderStats(scorecards) {
        const total = scorecards.length;
        const live = scorecards.filter(sc => sc.published).length;
        const totalLeads = scorecards.reduce((sum, sc) => sum + sc.leadCount, 0);

        statsEl.innerHTML = `
          <div class="wallet-card dash-stats">
            <div class="wallet-stats">
              <div><span class="wallet-num">${total}</span><span class="wallet-label">Scorecard${total === 1 ? '' : 's'}</span></div>
              <div><span class="wallet-num">${live}</span><span class="wallet-label">Live now</span></div>
              <div><span class="wallet-num">${totalLeads}</span><span class="wallet-label">Total lead${totalLeads === 1 ? '' : 's'}</span></div>
            </div>
          </div>
        `;
      }

      async function load() {
        const { scorecards } = await api('/scorecards');

        if (!scorecards.length) {
          statsEl.innerHTML = '';
          content.innerHTML = `
            <div class="empty-state">
              <svg width="56" height="56" viewBox="0 0 56 56" fill="none" style="margin:0 auto 18px;">
                <rect x="6" y="6" width="44" height="44" rx="12" stroke="var(--accent)" stroke-width="2.5" opacity="0.35"/>
                <path d="M18 28h20M18 20h20M18 36h12" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
              <h3>No scorecards yet</h3>
              <p>Create your first one to start qualifying leads.</p>
              <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;">
                <button class="btn btn-accent btn-sm" id="empty-new-btn">+ New scorecard</button>
                <a class="btn btn-ghost btn-sm" href="/templates.html">Browse templates</a>
              </div>
            </div>`;
          document.getElementById('empty-new-btn').addEventListener('click', createScorecard);
          return;
        }

        renderStats(scorecards);
        content.innerHTML = `<div class="sc-grid">${scorecards.map(sc => `
          <div class="sc-card sc-card-${sc.published ? 'live' : 'draft'}">
            ${sc.coverImage ? `<div class="sc-card-thumb" style="background-image:url('${escapeHtml(sc.coverImage)}');"></div>` : ''}
            <div class="sc-card-top">
              <div class="sc-title">${escapeHtml(sc.title)}</div>
              <span class="badge ${sc.published ? 'live' : 'draft'}">${sc.published ? 'Live' : 'Draft'}</span>
            </div>
            <div class="sc-meta">${sc.questions.length} question${sc.questions.length === 1 ? '' : 's'} · ${sc.leadCount} lead${sc.leadCount === 1 ? '' : 's'}</div>
            <div class="sc-meta sc-meta-faint">Updated ${new Date(sc.updatedAt).toLocaleDateString()}</div>
            <div class="sc-card-actions">
              <a class="btn btn-ghost btn-sm" href="/builder.html?id=${sc.id}">Edit</a>
              <a class="btn btn-ghost btn-sm" href="/leads.html?id=${sc.id}">Leads (${sc.leadCount})</a>
              ${sc.published ? `<a class="btn btn-ghost btn-sm" href="/report.html?id=${sc.id}">Report</a>` : ''}
              ${sc.published ? `<a class="btn btn-ghost btn-sm" href="/take/index.html?slug=${sc.slug}" target="_blank">View live</a>` : ''}
              <button class="btn btn-ghost btn-sm" data-delete="${sc.id}" data-title="${escapeHtml(sc.title)}">Delete</button> 
            </div>
          </div>
        `).join('')}</div>`;

        content.querySelectorAll('[data-delete]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const title = btn.dataset.title;
            if (!(await showConfirm(`Delete "${title}"? This also permanently deletes all its leads. This can't be undone.`))) return;
            try {
              await api(`/scorecards/${btn.dataset.delete}`, { method: 'DELETE' });
              load();
            } catch (err) {
              showToast(err.message || 'Could not delete this scorecard.');
            }
          });
        });
      }

      async function createScorecard() {
        try {
          const { scorecard } = await api('/scorecards', { method: 'POST', body: { title: 'Untitled scorecard' } });
          window.location.href = `/builder.html?id=${scorecard.id}`;
        } catch (err) {
          showToast(err.message || 'Could not create a new scorecard.');
        }
      }

      document.getElementById('new-btn').addEventListener('click', createScorecard);

      load();
    })();
  </script>
</body>
</html>
