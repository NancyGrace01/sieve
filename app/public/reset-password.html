<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set a new password — Sieve</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <nav class="nav"><a href="/index.html" class="brand"><span class="brand-mark">S</span>Sieve</a></nav>
    </header>
    <div class="app-narrow">
      <div class="auth-card">
        <h1 style="font-size:1.6rem;margin-bottom:6px;">Set a new password</h1>
        <div class="form-error" id="err"></div>
        <form id="reset-form">
          <div class="field"><label>New password</label><input type="password" id="password" minlength="8" required /></div>
          <button class="btn btn-accent btn-block" type="submit">Set password</button>
        </form>
        <div class="auth-switch"><a href="/login.html">← Back to login</a></div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const err = document.getElementById('err');
    if (!token) showError(err, 'This reset link is missing its token.');

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError(err);
      try {
        await api('/auth/reset-password', { method: 'POST', body: { token, newPassword: document.getElementById('password').value } });
        alert('Password updated — log in with your new password.');
        window.location.href = '/login.html';
      } catch (ex) {
        showError(err, ex.message);
      }
    });
  </script>
</body>
</html>
