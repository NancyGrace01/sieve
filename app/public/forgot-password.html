<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password — Sieve</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <nav class="nav"><a href="/index.html" class="brand"><span class="brand-mark">S</span>Sieve</a></nav>
    </header>
    <div class="app-narrow">
      <div class="auth-card">
        <h1 style="font-size:1.6rem;margin-bottom:6px;">Reset your password</h1>
        <p style="color:var(--ink-soft);font-size:14.5px;margin-bottom:24px;">Enter your email and we'll send a reset link.</p>
        <div class="form-error" id="err"></div>
        <div id="success" style="display:none;color:var(--good);font-size:14.5px;font-weight:600;margin-bottom:16px;"></div>
        <form id="forgot-form">
          <div class="field"><label>Email</label><input type="email" id="email" required /></div>
          <button class="btn btn-accent btn-block" type="submit">Send reset link</button>
        </form>
        <div class="auth-switch"><a href="/login.html">← Back to login</a></div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>
    const err = document.getElementById('err');
    const success = document.getElementById('success');
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError(err);
      try {
        const { message } = await api('/auth/forgot-password', { method: 'POST', body: { email: document.getElementById('email').value } });
        success.textContent = message;
        success.style.display = 'block';
        document.getElementById('forgot-form').style.display = 'none';
      } catch (ex) {
        showError(err, ex.message);
      }
    });
  </script>
</body>
</html>
