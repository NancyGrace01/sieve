<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Sieve</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/logo.png" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <nav class="nav">
        <a href="/index.html" class="brand"><img src="/logo.png" class="brand-mark" alt="Sieve logo" />Sieve</a>
      </nav>
    </header>
    <div class="app-narrow">
      <div class="auth-card">
        <h1 style="font-size:1.6rem;margin-bottom:6px;">Create your account</h1>
        <p style="color:var(--ink-soft);font-size:14.5px;margin-bottom:24px;" id="signup-sub">Free plan, no card required — build your first scorecard in minutes.</p>
        <div class="form-error" id="err"></div>
        <form id="signup-form">
          <div class="field"><label>Business name</label><input type="text" id="businessName" required /></div>
          <div class="field"><label>Email</label><input type="email" id="email" required /></div>
          <div class="field">
            <label>Password</label>
            <div class="field-password">
              <input type="password" id="password" minlength="8" required />
              <button type="button" class="field-password-toggle" data-toggle-password="password" aria-label="Show password"></button>
            </div>
          </div>
          <button class="btn btn-accent btn-block" type="submit">Create account</button>
        </form>
        <div class="auth-switch">Already have an account? <a href="/login.html">Log in</a></div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>
    const err = document.getElementById('err');
    const params = new URLSearchParams(location.search);
    const templateSlug = params.get('template');
    // Set by pricing.html's checkout CTAs — a visitor who picked a bundle/plan
    // before signing up should land straight on that checkout, not the dashboard.
    const nextStep = params.get('next');

    // Full template content used to come from a preloaded global; now it's
    // fetched once, here, before the form can even be submitted — chosenTemplate
    // stays null until (and unless) that fetch resolves.
    let chosenTemplate = null;
    (async () => {
      if (!templateSlug) return;
      try {
        const res = await fetch(`/api/templates/${encodeURIComponent(templateSlug)}`);
        const data = await res.json();
        if (!res.ok) return; // an unknown/unpublished slug just falls back to the default copy below
        chosenTemplate = data.template;
        document.getElementById('signup-sub').textContent = `You'll start with the "${chosenTemplate.title}" template — free plan, no card required.`;
      } catch {
        // Non-critical — signup itself still works without a chosen template.
      }
    })();
    if (nextStep === 'billing') {
      document.getElementById('signup-sub').textContent = `Create your free account first — you'll land straight on checkout next.`;
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError(err);
      try {
        await api('/auth/signup', {
          method: 'POST',
          body: {
            businessName: document.getElementById('businessName').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          },
        });
        if (chosenTemplate) {
          const id = await createScorecardFromTemplate(chosenTemplate);
          window.location.href = `/builder.html?id=${id}`;
          return;
        }
        if (nextStep === 'billing') {
          const forward = new URLSearchParams(location.search);
          forward.delete('next');
          window.location.href = `/billing.html?${forward.toString()}`;
          return;
        }
        window.location.href = '/dashboard.html';
      } catch (ex) {
        showError(err, ex.message);
      }
    });
  </script>
</body>
</html>
