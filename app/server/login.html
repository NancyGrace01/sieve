<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Sieve</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/logo.png" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <nav class="nav">
        <a href="/index.html" class="brand"><img src="/logo.png" class="brand-mark" alt="Sieve logo" />Sieve</a>
      </nav>
    </header>
    <div class="app-narrow">
      <div class="auth-card">
        <h1 style="font-size:1.6rem;margin-bottom:6px;">Welcome back</h1>
        <p style="color:var(--ink-soft);font-size:14.5px;margin-bottom:24px;">Log in to your Sieve dashboard.</p>
        <div class="form-error" id="err"></div>
        <form id="login-form">
          <div class="field"><label>Email</label><input type="email" id="email" required /></div>
          <div class="field"><label>Password</label><input type="password" id="password" required /></div>
          <button class="btn btn-accent btn-block" type="submit">Log in</button>
        </form>
        <div class="auth-switch"><a href="/forgot-password.html">Forgot password?</a></div>
        <div class="auth-switch">New to Sieve? <a href="/signup.html">Create a free account</a></div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>
    const err = document.getElementById('err');
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError(err);
      try {
        await api('/auth/login', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          },
        });
        window.location.href = '/dashboard.html';
      } catch (ex) {
        showError(err, ex.message);
      }
    });
  </script>
</body>
</html>
